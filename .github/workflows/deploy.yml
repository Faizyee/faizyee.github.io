name: Deploy pre-built dist from subfolder to GitHub Pages

on:
  push:
    branches: ["main"] # Sesuaikan jika nama branch utama Anda 'master'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact from subfolder dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: './faizyee-projects/dist' # Menunjuk langsung ke folder dist di subfolder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5